# ==============================================================================
# SIMATA PLN - Netlify Production Configuration & Optimization
# Designed for high performance, zero bandwidth waste & edge caching compliance
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 1. Immutable Long-Term Caching for Bundled Static Assets (Saves 99% Bandwidth)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# 2. Revalidation Caching for Root HTML (Ensures Instant App Updates)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
